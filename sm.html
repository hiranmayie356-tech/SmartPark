<!DOCTYPE html>
<html>
<head>
  <title>Parking Booking</title>

  <!-- Google Identity Services library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <h1>Student Parking Booking</h1>

  <!-- Google Sign-In configuration -->
  <div id="g_id_onload"
       data-client_id="YOUR_CLIENT_ID"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>

  <!-- Google Sign-In button -->
  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular"
       data-logo_alignment="left">
  </div>

  <!-- Booking form (hidden until login) -->
  <div id="booking-form" style="display:none;">
    <h2>Book a Slot</h2>
    <input type="text" id="slot" placeholder="Slot Number"><br><br>
    <input type="date" id="date"><br><br>
    <input type="time" id="time"><br><br>
    <button onclick="bookSlot()">Book</button>
  </div>

  <!-- JavaScript logic -->
  <script>
    let userEmail = "";

    // Called automatically after Google login
    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      userEmail = data.email;

      // Show booking form after successful login
      document.getElementById("booking-form").style.display = "block";
    }

    // Decode the JWT token from Google
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      return JSON.parse(jsonPayload);
    }

    // Send booking data to Apps Script backend
    function bookSlot() {
      const slot = document.getElementById("slot").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;

      fetch("YOUR_WEB_APP_URL/exec", {
        method: "POST",
        body: JSON.stringify({
          slot: slot,
          name: userEmail.split("@")[0],
          email: userEmail,
          date: date,
          time: time
        })
      })
      .then(res => res.json())
      .then(() => alert("Booking successful!"))
      .catch(err => alert("Error: " + err));
    }
  </script>

</body>
</html>
