<!DOCTYPE html>
<html>
<head>
  <title>Parking Booking</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  .container {
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 350px;
  }

  #booking-form {
    margin-top: 20px;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background-color: #1a73e8;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
  }

  button:hover {
    background-color: #1558b0;
  }
</style>


  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <h1>Smart Vehicle Parking</h1>

  <div id="g_id_onload"
       data-client_id="389348627634-rrp09se9ajiss6qhb9tnfqdgf106105p.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular"
       data-logo_alignment="left">
  </div>

 
  <div id="booking-form" style="display:none;">
    <h2>Book a Slot</h2>
    <input type="text" id="slot" placeholder="Slot Number"><br><br>
    <input type="date" id="date"><br><br>
    <input type="time" id="time"><br><br>
    <button onclick="bookSlot()">Book</button>
  </div>

  
  <script>
   let userEmail = "";

    window.handleCredentialResponse = function (response) {
  const data = parseJwt(response.credential);
  userEmail = data.email;
  document.getElementById("booking-form").style.display = "block";
};
    

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      return JSON.parse(jsonPayload);
    }

    function bookSlot() {
      const slot = document.getElementById("slot").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;

      fetch("https://script.google.com/macros/s/AKfycbzUnjDkCsMyvAi5Sv3EbIKOtEWV9J1rORbwOcjI3fIQTl-1cv_6FarneszQ2TFzkhzKRQ/exec", {
        method: "POST",
        body: JSON.stringify({
          slot: slot,
          name: userEmail.split("@")[0],
          email: userEmail,
          date: date,
          time: time
        })
      })
      .then(res => res.json())
      .then(() => alert("Booking successful!"))
      .catch(err => alert("Error: " + err));
    }

  </script>

</body>
</html>
