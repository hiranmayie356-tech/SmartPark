<!DOCTYPE html>
<html>
<head>
<title>Parking Booking</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    position: relative;
    background-color: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("https://images.unsplash.com/photo-1549399542-7e3f8b79c341?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.2;
    z-index: -1;
}

h1 {
    text-align: center;
    color: #333;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    padding: 30px 40px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    width: 350px;
    margin: auto;
    margin-top: 80px;
}

#booking-form {
    margin-top: 20px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background-color: #1a73e8;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background-color: #1558b0;
}
</style>

<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="container">
    <h2>Book a Slot</h2>
    <form id="booking-form">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="date">Date:</label><br>
        <input type="date" id="date" name="date" required><br><br>
        
        <label for="time">Time:</label><br>
        <input type="time" id="time" name="time" required><br><br>
        
        <button type="submit">Book Slot</button>
    </form>
</div>
</body>
</html>
